plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'  // Flutter Gradle Plugin
    id 'com.google.gms.google-services'  // Firebase Services
}

android {
    namespace "com.example.tripnest"
    compileSdk 34  // Use the latest compile SDK version
    ndkVersion "25.2.9519653"  // Set your actual NDK version

    defaultConfig {
        applicationId "com.example.tripnest"
        minSdk 23
        targetSdk 34  // Ensure it matches compileSdk
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        debug {
            storeFile file("$rootDir/app/debug.keystore")  // ✅ Fixed Path
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.9.0')  // ✅ Firebase BOM (Latest Version)
    implementation 'com.google.firebase:firebase-auth'  // ✅ Firebase Authentication
    implementation 'com.google.firebase:firebase-firestore'  // ✅ Firebase Firestore
}
